<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>For Lucia</title>

<style>
  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    overflow: hidden;
    background: #000;
  }
  @media (min-width: 481px) {
    #stage {
      height: min(100dvh, 860px);
      border-radius: 26px;
      box-shadow: 0 30px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.08);
    }
  }

  .scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
    cursor: pointer;
    animation: sceneFade .4s ease-out both;
  }
  @keyframes sceneFade {
    from { opacity: 0; transform: scale(1.02); }
    to { opacity: 1; transform: scale(1); }
  }

  .scene-photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    animation: aliveMotion 7s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes aliveMotion {
    0%   { transform: scale(1.02) translate(0px, 0px) rotate(0deg); }
    25%  { transform: scale(1.04) translate(-3px, 2px) rotate(0.2deg); }
    50%  { transform: scale(1.03) translate(2px, -3px) rotate(-0.3deg); }
    75%  { transform: scale(1.05) translate(-2px, 3px) rotate(0.2deg); }
    100% { transform: scale(1.02) translate(1px, -1px) rotate(0deg); }
  }

  .scene.has-impact .scene-photo {
    animation: impactShake .45s ease, aliveMotion 7s ease-in-out infinite alternate;
  }
  @keyframes impactShake {
    0%   { transform: translate(0,0) scale(1.05); }
    20%  { transform: translate(-10px,5px) scale(1.05); }
    40%  { transform: translate(8px,-5px) scale(1.05); }
    60%  { transform: translate(-6px,3px) scale(1.05); }
    80%  { transform: translate(4px,-2px) scale(1.05); }
    100% { transform: translate(0,0) scale(1.02); }
  }
</style>
</head>
<body>
<div id="app"><div id="stage"></div></div>

<script>
const SCENES = [
  { id:'01', kind:'loading', duration:2400, image:'assets/scene-01.jpg' },
  { id:'02', kind:'tap', image:'assets/scene-02.jpg' },
  { id:'03', kind:'tap', image:'assets/scene-03.jpg' },
  { id:'04', kind:'tap', image:'assets/scene-04.jpg', sfx:'flower' },
  { id:'05', kind:'tap', image:'assets/scene-05.jpg' },
  { id:'06', kind:'tap', image:'assets/scene-06.jpg' },
  { id:'07', kind:'tap', image:'assets/scene-07.jpg', sfx:'train' },
  { id:'08', kind:'tap', image:'assets/scene-08.jpg', sfx:'wind' },
  { id:'09', kind:'tap', image:'assets/scene-09.jpg', sfx:'wind' },
  { id:'10', kind:'tap', image:'assets/scene-10.jpg', sfx:'crash', impact:true },
  { id:'11', kind:'tap', image:'assets/scene-11.jpg' },
  { id:'12', kind:'end', image:'assets/scene-12.jpg' }
];

// Audio Management System
const bgm = new Audio('assets/bgm.mp3');
bgm.loop = true;
bgm.volume = 0.35;

const sfxMap = {
  flower: new Audio('assets/flower.mp3'),
  train: new Audio('assets/train.mp3'),
  wind: new Audio('assets/wind.mp3'),
  crash: new Audio('assets/crash.mp3')
};

// Set volumes for SFX
Object.values(sfxMap).forEach(audio => audio.volume = 0.85);

let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  bgm.play().catch(() => {});
}

function triggerSFX(sfxKey) {
  if (!sfxKey || !sfxMap[sfxKey]) return;
  // Stop and reset current audio instance before re-playing
  const sound = sfxMap[sfxKey];
  sound.currentTime = 0;
  sound.play().catch(() => {});
}

// Preload images into memory
SCENES.forEach(s => {
  const img = new Image();
  img.src = s.image;
});

function buildScene(s){
  const impactClass = s.impact ? ' has-impact' : '';
  return '<div class="scene' + impactClass + '">' +
           '<div class="scene-photo" style="background-image:url(\'' + s.image + '\')"></div>' +
         '</div>';
}

const stage = document.getElementById('stage');
let current = 0;
let autoTimer = null;

function render(i){
  clearTimeout(autoTimer);
  const s = SCENES[i];
  stage.innerHTML = buildScene(s);

  if (s.sfx) {
    triggerSFX(s.sfx);
  }

  if (s.kind === 'loading'){
    autoTimer = setTimeout(goNext, s.duration || 2400);
  }
}

function goNext(){
  clearTimeout(autoTimer);
  current = Math.min(SCENES.length - 1, current + 1);
  render(current);
}

function goPrev(){
  clearTimeout(autoTimer);
  current = Math.max(0, current - 1);
  render(current);
}

stage.addEventListener('click', function(e){
  unlockAudio();
  if (current === SCENES.length - 1) return;
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width * 0.25) goPrev(); else goNext();
});

document.addEventListener('keydown', function(e){
  unlockAudio();
  if (current === SCENES.length - 1) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); goPrev(); }
  else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); goNext(); }
});

render(current);
</script>
</body>
</html>
