<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>For Lucia</title>

<style>
  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #000;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: 480px;
    overflow: hidden;
    background: #000;
  }
  @media (min-width: 481px) {
    #stage {
      height: min(100dvh, 860px);
      border-radius: 26px;
      box-shadow: 0 30px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.08);
    }
  }

  /* Dual Layer crossfade transition */
  .scene-layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.45s cubic-bezier(0.25, 1, 0.5, 1), transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    transform: scale(1.03);
    pointer-events: none;
    will-change: opacity, transform;
  }

  .scene-layer.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* Image containment: Fits complete picture & titles inside screen without clipping */
  .scene-photo {
    position: absolute;
    inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    animation: aliveMotion 7s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes aliveMotion {
    0%   { transform: scale(1.01) translate(0px, 0px) rotate(0deg); }
    25%  { transform: scale(1.025) translate(-2px, 2px) rotate(0.15deg); }
    50%  { transform: scale(1.02) translate(2px, -2px) rotate(-0.2deg); }
    75%  { transform: scale(1.03) translate(-1px, 2px) rotate(0.15deg); }
    100% { transform: scale(1.01) translate(1px, -1px) rotate(0deg); }
  }

  .has-impact .scene-photo {
    animation: impactShake 0.45s ease, aliveMotion 7s ease-in-out infinite alternate;
  }
  @keyframes impactShake {
    0%   { transform: translate(0,0) scale(1.04); }
    20%  { transform: translate(-10px,5px) scale(1.04); }
    40%  { transform: translate(8px,-5px) scale(1.04); }
    60%  { transform: translate(-6px,3px) scale(1.04); }
    80%  { transform: translate(4px,-2px) scale(1.04); }
    100% { transform: translate(0,0) scale(1.01); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="layerA" class="scene-layer active"></div>
    <div id="layerB" class="scene-layer"></div>
  </div>
</div>

<script>
const SCENES = [
  { id:'01', kind:'loading', duration:2400, image:'assets/scene-01.jpg' },
  { id:'02', kind:'tap', image:'assets/scene-02.jpg' },
  { id:'03', kind:'tap', image:'assets/scene-03.jpg' },
  { id:'04', kind:'tap', image:'assets/scene-04.jpg', sfx:'flower' },
  { id:'05', kind:'tap', image:'assets/scene-05.jpg' },
  { id:'06', kind:'tap', image:'assets/scene-06.jpg' },
  { id:'07', kind:'tap', image:'assets/scene-07.jpg', sfx:'train' },
  { id:'08', kind:'tap', image:'assets/scene-08.jpg', sfx:'wind' },
  { id:'09', kind:'tap', image:'assets/scene-09.jpg', sfx:'wind' },
  { id:'10', kind:'tap', image:'assets/scene-10.jpg', sfx:'crash', impact:true },
  { id:'11', kind:'tap', image:'assets/scene-11.jpg' },
  { id:'12', kind:'end', image:'assets/scene-12.jpg' }
];

// Audio Management System
const bgm = new Audio('assets/bgm.mp3');
bgm.loop = true;
bgm.volume = 0.35;

const sfxMap = {
  flower: new Audio('assets/flower.mp3'),
  train: new Audio('assets/train.mp3'),
  wind: new Audio('assets/wind.mp3'),
  crash: new Audio('assets/crash.mp3')
};

Object.values(sfxMap).forEach(audio => {
  audio.volume = 0.85;
  audio.load();
});

let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  bgm.play().catch(() => {});
}

function triggerSFX(sfxKey) {
  if (!sfxKey || !sfxMap[sfxKey]) return;
  const sound = sfxMap[sfxKey];
  sound.currentTime = 0;
  sound.play().catch(() => {});
}

// Preload scene images into cache
SCENES.forEach(s => {
  const img = new Image();
  img.src = s.image;
});

const layerA = document.getElementById('layerA');
const layerB = document.getElementById('layerB');
const stage = document.getElementById('stage');

let current = 0;
let activeLayer = layerA;
let inactiveLayer = layerB;
let autoTimer = null;
let soundTimer = null;

function render(i){
  clearTimeout(autoTimer);
  clearTimeout(soundTimer);

  const s = SCENES[i];
  const impactClass = s.impact ? ' has-impact' : '';

  // Render content into the hidden layer first for smooth crossfade
  inactiveLayer.className = 'scene-layer' + impactClass;
  inactiveLayer.innerHTML = '<div class="scene-photo" style="background-image:url(\'' + s.image + '\')"></div>';

  // Crossfade layers
  inactiveLayer.classList.add('active');
  activeLayer.classList.remove('active');

  // Swap layer references
  const temp = activeLayer;
  activeLayer = inactiveLayer;
  inactiveLayer = temp;

  // Trigger SFX immediately when transitioning
  if (s.sfx) {
    triggerSFX(s.sfx);
  }

  // Handle auto-advance with 1-second early sound trigger
  if (s.kind === 'loading'){
    const totalDuration = s.duration || 2400;
    const soundLeadTime = Math.max(0, totalDuration - 1000);

    // Trigger next scene sound 1 second earlier
    if (SCENES[i + 1] && SCENES[i + 1].sfx) {
      soundTimer = setTimeout(() => {
        triggerSFX(SCENES[i + 1].sfx);
      }, soundLeadTime);
    }

    autoTimer = setTimeout(goNext, totalDuration);
  }
}

function goNext(){
  if (current >= SCENES.length - 1) return;
  current++;
  render(current);
}

function goPrev(){
  if (current <= 0) return;
  current--;
  render(current);
}

// Instant trigger on tap down for maximum responsiveness
stage.addEventListener('pointerdown', function(e){
  unlockAudio();
  if (current === SCENES.length - 1) return;
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width * 0.25) goPrev(); else goNext();
});

document.addEventListener('keydown', function(e){
  unlockAudio();
  if (current === SCENES.length - 1) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); goPrev(); }
  else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); goNext(); }
});

// Initial Render
render(0);
</script>
</body>
</html>
